<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>做题 App 原型</title>
  <style>
    :root{
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      --text-title: 16px/24px var(--font-sans);
      --text-body: 14px/20px var(--font-sans);
      --text-caption: 12px/18px var(--font-sans);
      --text-code: 13px/20px var(--font-mono);

      --weight-medium: 600;
      --weight-strong: 700;

      --spacer-4: 4px;
      --spacer-8: 8px;
      --spacer-12: 12px;
      --spacer-16: 16px;
      --spacer-20: 20px;
      --spacer-24: 24px;

      --radius: 8px;
      --radius-card: 12px;
      --radius-full: 999px;

      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-muted: #f6f6f8;
      --border: rgba(0,0,0,.12);
      --text: rgba(0,0,0,.88);
      --text-muted: rgba(0,0,0,.6);
      --shadow: 0 10px 30px rgba(0,0,0,.10);

      --brand: #6E56CF;
      --brand-weak: rgba(110,86,207,.12);
      --accent: #2E7CF6;

      --good: #0B7A47;
      --bad: #B42318;
    }

    * { box-sizing: border-box; }

    body{
      margin: 0;
      font: var(--text-body);
      color: var(--text);
      background: var(--bg);
    }

    .page{
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: var(--spacer-16);
      margin-bottom: var(--spacer-16);
    }

    .hero h1{
      margin: 0 0 8px 0;
      font: var(--weight-medium) 20px/28px var(--font-sans);
    }

    .hero p{
      margin: 0;
      color: var(--text-muted);
    }

    .proto-wrap{
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .proto-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: var(--spacer-12);
      padding: var(--spacer-12) var(--spacer-16);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .title{
      font: var(--weight-medium) var(--text-title);
    }

    .badges{
      display:flex;
      gap: var(--spacer-8);
      flex-wrap: wrap;
      align-items:center;
      justify-content:flex-end;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface-muted);
      font: var(--text-caption);
      color: var(--text-muted);
    }

    .pill b{
      color: var(--text);
      font-weight: var(--weight-medium);
    }

    .proto-main{
      display:grid;
      grid-template-columns: 1fr 340px;
      gap: var(--spacer-16);
      padding: var(--spacer-16);
      background: var(--surface-muted);
    }

    @media (max-width: 860px){
      .proto-main{ grid-template-columns: 1fr; }
    }

    .phone{
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 16px 40px rgba(0,0,0,.12);
      overflow: hidden;
    }

    .statusbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: var(--spacer-8) var(--spacer-16);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font: var(--text-caption);
      color: var(--text-muted);
    }

    .navbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: var(--spacer-12);
      padding: var(--spacer-12) var(--spacer-16);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .nav-left, .nav-right{
      display:flex;
      align-items:center;
      gap: var(--spacer-8);
    }

    .iconbtn{
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font: var(--text-caption);
      cursor: pointer;
    }

    .iconbtn:hover{ border-color: rgba(110,86,207,.45); }

    .nav-title{
      font: var(--weight-medium) var(--text-title);
      letter-spacing: .2px;
    }

    .screen{
      padding: var(--spacer-16);
      min-height: 560px;
      background: var(--surface);
    }

    .section{
      padding: var(--spacer-12);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--surface);
    }

    .h2{
      font: var(--weight-medium) var(--text-title);
      margin: 0 0 var(--spacer-8) 0;
    }

    .p{
      margin: 0;
      color: var(--text-muted);
    }

    .row{
      display:flex;
      gap: var(--spacer-12);
      align-items:center;
    }

    .row.wrap{ flex-wrap: wrap; }

    .btn{
      border: 1px solid rgba(110,86,207,.55);
      background: var(--brand);
      color: white;
      border-radius: var(--radius);
      padding: 10px 12px;
      font: var(--weight-medium) var(--text-body);
      cursor:pointer;
    }

    .btn.secondary{
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn.ghost{
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .field{
      width: 100%;
      display:flex;
      flex-direction: column;
      gap: 6px;
    }

    .label{
      font: var(--text-caption);
      color: var(--text-muted);
    }

    .input{
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 10px 12px;
      font: var(--text-body);
      color: var(--text);
      width: 100%;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap: var(--spacer-8);
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--spacer-12);
      background: var(--surface);
    }

    .card .meta{
      font: var(--text-caption);
      color: var(--text-muted);
    }

    .card .title{
      font: var(--weight-medium) var(--text-body);
      margin-top: 4px;
    }

    .card .actions{
      margin-top: var(--spacer-8);
      display:flex;
      gap: var(--spacer-8);
      flex-wrap:wrap;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface-muted);
      font: var(--text-caption);
      color: var(--text-muted);
    }

    .tag.brand{
      border-color: rgba(110,86,207,.45);
      background: var(--brand-weak);
      color: var(--text);
    }

    .tag.good{
      border-color: rgba(11,122,71,.35);
      background: rgba(11,122,71,.12);
      color: var(--text);
    }

    .tag.bad{
      border-color: rgba(180,35,24,.35);
      background: rgba(180,35,24,.12);
      color: var(--text);
    }

    .divider{
      height:1px;
      background: var(--border);
      margin: var(--spacer-12) 0;
    }

    .helper{
      font: var(--text-caption);
      color: var(--text-muted);
    }

    .sidebar{
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: var(--spacer-12);
    }

    .sidebar h3{
      font: var(--weight-medium) var(--text-title);
      margin: 0 0 var(--spacer-8) 0;
    }

    .step{
      display:flex;
      gap: var(--spacer-8);
      align-items:flex-start;
      padding: var(--spacer-8);
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
    }

    .step:hover{
      background: var(--surface-muted);
      border-color: var(--border);
    }

    .step.active{
      border-color: rgba(110,86,207,.45);
      background: var(--brand-weak);
    }

    .step .k{
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      font: var(--text-caption);
      color: var(--text-muted);
      flex: 0 0 auto;
    }

    .step.active .k{
      background: rgba(110,86,207,.18);
      color: var(--text);
      border-color: rgba(110,86,207,.4);
    }

    .step .t{ flex:1; }

    .step .t .name{
      font: var(--weight-medium) var(--text-body);
    }

    .step .t .desc{
      font: var(--text-caption);
      color: var(--text-muted);
      margin-top: 2px;
    }

    .toast{
      display:none;
      margin-top: var(--spacer-12);
      padding: var(--spacer-12);
      border: 1px solid rgba(110,86,207,.45);
      background: var(--brand-weak);
      border-radius: var(--radius-card);
      font: var(--text-caption);
      color: var(--text);
    }

    .toast.show{ display:block; }

    .modal-backdrop{
      display:none;
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.35);
      padding: var(--spacer-16);
    }

    .modal-backdrop.show{
      display:flex;
      align-items:flex-end;
    }

    .modal{
      width:100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--spacer-12);
    }

    .modal .modal-title{
      font: var(--weight-medium) var(--text-title);
    }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacer-12);
    }

    @media (max-width: 520px){
      .grid2{ grid-template-columns: 1fr; }
    }

    .kpi{
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: var(--spacer-12);
    }

    .kpi .v{
      font: var(--weight-strong) var(--text-title);
    }

    .kpi .l{
      font: var(--text-caption);
      color: var(--text-muted);
      margin-top: 2px;
    }

    .choice{
      display:flex;
      align-items:center;
      gap: var(--spacer-8);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor:pointer;
    }

    .choice:hover{
      border-color: rgba(110,86,207,.45);
    }

    .choice input{
      accent-color: var(--brand);
    }

    .question{
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--spacer-12);
      background: var(--surface);
    }

    .question .qtitle{
      font: var(--weight-medium) var(--text-body);
    }

    .question .qmeta{
      margin-top: 4px;
      font: var(--text-caption);
      color: var(--text-muted);
      display:flex;
      gap: var(--spacer-8);
      flex-wrap:wrap;
    }

    .progress{
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--surface-muted);
      border: 1px solid var(--border);
      overflow:hidden;
    }

    .progress > div{
      height:100%;
      width: 0%;
      background: var(--brand);
      transition: width 160ms ease;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <h1>做题 App 交互原型</h1>
      <p>这是一个可本地直接打开的单文件 HTML 原型，包含学生端与教师端流程，当前仅用于演示页面结构、交互跳转与业务口径。</p>
    </div>

    <div class="proto-wrap" id="proto">
      <div class="proto-top">
        <div class="title">做题 App（UniApp）交互原型</div>
        <div class="badges">
          <span class="pill">当前角色：<b id="badgeRole">未选择</b></span>
          <span class="pill">当前班级：<b id="badgeClass">—</b></span>
          <span class="pill">当前任务：<b id="badgeTask">—</b></span>
        </div>
      </div>

      <div class="proto-main">
        <div class="phone" id="phone">
          <div class="statusbar"><span>09:41</span><span>4G · 100%</span></div>
          <div class="navbar">
            <div class="nav-left">
              <button class="iconbtn" id="btnBack">返回</button>
              <span class="tag brand" id="navChip">入口</span>
            </div>
            <div class="nav-title" id="navTitle">选择入口</div>
            <div class="nav-right">
              <button class="iconbtn" id="btnReset">重置</button>
            </div>
          </div>

          <div class="screen" id="screen"></div>

          <div class="modal-backdrop" id="modal">
            <div class="modal">
              <div class="modal-title" id="modalTitle">弹窗</div>
              <div class="divider"></div>
              <div id="modalBody"></div>
              <div class="divider"></div>
              <div class="row" style="justify-content:flex-end">
                <button class="btn secondary" id="modalCancel">取消</button>
                <button class="btn" id="modalOk">确定</button>
              </div>
            </div>
          </div>
        </div>

        <div class="sidebar">
          <h3>快速跳转</h3>
          <div class="helper">用于检查流程是否完整，不代表最终导航结构。</div>
          <div class="divider"></div>
          <div class="list" id="steps"></div>
          <div class="toast" id="toast"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const root = document.querySelector('#proto');
      const $ = (sel) => root.querySelector(sel);
      const screen = $('#screen');
      const navTitle = $('#navTitle');
      const navChip = $('#navChip');
      const badgeRole = $('#badgeRole');
      const badgeClass = $('#badgeClass');
      const badgeTask = $('#badgeTask');
      const btnBack = $('#btnBack');
      const btnReset = $('#btnReset');

      const modal = $('#modal');
      const modalTitle = $('#modalTitle');
      const modalBody = $('#modalBody');
      const modalCancel = $('#modalCancel');
      const modalOk = $('#modalOk');

      const stepsEl = $('#steps');
      const toast = $('#toast');

      const state = {
        stack: [],
        role: null,
        className: null,
        classCode: null,
        taskId: null,
        taskName: null,
        quiz: {
          idx: 0,
          total: 5,
          answers: {},
          wrongIds: ['Q2', 'Q5']
        },
        teacher: {
          currentBank: '数学-题库A',
          currentClass: '七年级(2)班',
          aiReviewOn: true
        }
      };

      const routes = {
        entry: { chip: '入口', title: '选择入口' },
        s_join: { chip: '学生端', title: '加入班级' },
        s_tasks: { chip: '学生端', title: '学习任务' },
        s_task_detail: { chip: '学生端', title: '任务详情' },
        s_doing: { chip: '学生端', title: '开始做题' },
        s_review: { chip: '学生端', title: '批阅结果' },
        s_wrong: { chip: '学生端', title: '错题集' },
        t_login: { chip: '教师端', title: '教师登录' },
        t_home: { chip: '教师端', title: '管理主页' },
        t_class: { chip: '教师端', title: '班级管理' },
        t_bank: { chip: '教师端', title: '题库管理' },
        t_task_mgmt: { chip: '教师端', title: '学习任务管理' },
        t_wrong_stats: { chip: '教师端', title: '错题统计' }
      };

      const jumpList = [
        { id:'entry', name:'入口选择', desc:'学生端 / 教师端' },
        { id:'s_join', name:'学生加入班级', desc:'选择班级或输入班级码' },
        { id:'s_tasks', name:'学生任务列表', desc:'查看学习任务' },
        { id:'s_task_detail', name:'任务详情/开始', desc:'抽题规则说明' },
        { id:'s_doing', name:'做题页面', desc:'选择/填空/输入答案' },
        { id:'s_review', name:'批阅结果', desc:'答案+AI联合批阅' },
        { id:'s_wrong', name:'错题集', desc:'错题回顾与再练' },
        { id:'t_login', name:'教师登录', desc:'账号登录入口' },
        { id:'t_home', name:'教师主页', desc:'班级/题库/任务/统计' },
        { id:'t_class', name:'班级管理', desc:'邀请、审核学生，多老师' },
        { id:'t_bank', name:'题库管理', desc:'开关、重传、AI审核开关' },
        { id:'t_task_mgmt', name:'学习任务管理', desc:'查看学习次数与错题统计' },
        { id:'t_wrong_stats', name:'错题统计', desc:'所有学生做错题目统计' }
      ];

      function setToast(msg){
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(setToast._t);
        setToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
      }

      function setHeader(routeId){
        const r = routes[routeId] || routes.entry;
        navTitle.textContent = r.title;
        navChip.textContent = r.chip;

        badgeRole.textContent = state.role ? (state.role === 'student' ? '学生' : '教师') : '未选择';
        badgeClass.textContent = state.className ? state.className : '—';
        badgeTask.textContent = state.taskName ? state.taskName : '—';

        btnBack.disabled = state.stack.length <= 1;
      }

      function push(routeId){
        state.stack.push(routeId);
        render(routeId);
      }

      function replace(routeId){
        if (state.stack.length === 0) state.stack.push(routeId);
        else state.stack[state.stack.length - 1] = routeId;
        render(routeId);
      }

      function back(){
        if (state.stack.length <= 1) return;
        state.stack.pop();
        render(state.stack[state.stack.length - 1]);
      }

      function openModal({title, bodyHtml, okText='确定', cancelText='取消', onOk}){
        modalTitle.textContent = title;
        modalBody.innerHTML = bodyHtml;
        modalOk.textContent = okText;
        modalCancel.textContent = cancelText;
        modal.classList.add('show');

        const cleanup = () => {
          modal.classList.remove('show');
          modalOk.onclick = null;
          modalCancel.onclick = null;
        };

        modalCancel.onclick = cleanup;
        modalOk.onclick = () => {
          try { onOk && onOk(); } finally { cleanup(); }
        };
      }

      function renderEntry(){
        screen.innerHTML = `
          <div class="section">
            <div class="h2">选择入口</div>
            <p class="p">仅演示流程与页面结构，不接真实数据。</p>
            <div class="divider"></div>
            <div class="row wrap">
              <button class="btn" data-go="student">进入学生端</button>
              <button class="btn secondary" data-go="teacher">进入教师端</button>
            </div>
            <div class="divider"></div>
            <div class="helper">学生端：加入班级 → 任务列表 → 做题 → 批阅 → 错题集</div>
            <div class="helper">教师端：登录 → 班级管理 / 题库管理 / 学习任务 / 错题统计</div>
          </div>
        `;
      }

      function renderStudentJoin(){
        screen.innerHTML = `
          <div class="section">
            <div class="h2">加入班级</div>
            <p class="p">两种方式：选择已有班级，或输入班级码。</p>
            <div class="divider"></div>

            <div class="grid2">
              <div class="field">
                <div class="label">班级码</div>
                <input class="input" id="classCode" placeholder="例如：A1B2C3" value="${state.classCode || ''}" />
                <div class="row wrap">
                  <button class="btn" id="btnJoin">输入班级码进入</button>
                  <button class="btn secondary" id="btnPaste">一键填入示例码</button>
                </div>
              </div>

              <div class="field">
                <div class="label">选择班级（示例）</div>
                <div class="list">
                  <div class="card">
                    <div class="meta">班级</div>
                    <div class="title">七年级(2)班</div>
                    <div class="actions">
                      <button class="btn" data-pick-class="七年级(2)班">进入</button>
                      <button class="btn ghost" data-class-info="七年级(2)班">查看信息</button>
                    </div>
                  </div>
                  <div class="card">
                    <div class="meta">班级</div>
                    <div class="title">八年级(1)班</div>
                    <div class="actions">
                      <button class="btn" data-pick-class="八年级(1)班">进入</button>
                      <button class="btn ghost" data-class-info="八年级(1)班">查看信息</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="divider"></div>
            <div class="helper">真实业务中：教师邀请/审核通过后才可进入；这里用弹窗模拟。</div>
          </div>
        `;

        const codeInput = $('#classCode');
        $('#btnPaste').addEventListener('click', () => { codeInput.value = 'A1B2C3'; });
        $('#btnJoin').addEventListener('click', () => {
          const code = (codeInput.value || '').trim();
          if (!code){ setToast('请先输入班级码'); return; }
          state.classCode = code;
          openModal({

      function questionFixture(i){
        const items = [
          { id:'Q1', type:'选择题', subject:'英语', diff:1, stem:'选择正确的单词拼写', options:['appple','apple','aple','appel'], hint:'', answer:'apple' },

          { id:'Q5', type:'输入答案', subject:'英语', diff:3, stem:'写出一个“happy”的同义词', options:null, hint:'例如：glad', answer:'glad' },
        ];
        return items[i] || items[0];
      }

      function renderStudentDoing(){
        const idx = state.quiz.idx;

          const selected = state.quiz.answers[q.id] || '';
          body = `
            <div class="list">

                  <div>${opt}</div>

          `;
        } else {
          const val = state.quiz.answers[q.id] || '';
          body = `
            <div class="field">
              <div class="label">${q.hint || '请输入答案'}</div>
              <input class="input" id="ans" value="${String(val).replace(/"/g,'&quot;')}" placeholder="${q.hint || ''}" />
            </div>
          `;
        }

        screen.innerHTML = `

            <div class="row" style="justify-content:space-between; align-items:flex-end">

                <div class="h2">做题中</div>

            <div class="helper" style="margin-top:8px">提交后：系统答案 + AI 共同批阅（展示用）。</div>
          </div>
        `;

        function save(){
          if (q.type === '选择题'){
            const checked = screen.querySelector('input[name="opt"]:checked');
            state.quiz.answers[q.id] = checked ? checked.value : '';

              </div>
              <div class="actions">
                <button class="btn" id="btnUpload">重新上传题库</button>
                <button class="btn secondary" id="btnToggle">切换 AI 自动审核</button>
                <button class="btn ghost" id="btnFields">查看题目字段</button>
              </div>
            </div>

            <div style="height:8px"></div>
            <div class="card">
              <div class="meta">题库</div>
              <div class="title">英语 · 题库-01（示例）</div>
              <div class="actions">
                <button class="btn secondary" id="btnCloseBank">打开/关闭题库（模拟）</button>
              </div>
            </div>
          </div>
        `;

        $('#btnUpload').addEventListener('click', () => setToast('已重新上传（示例）'));
        $('#btnToggle').addEventListener('click', () => {
          state.teacher.aiReviewOn = !state.teacher.aiReviewOn;
          replace('t_bank');
        });
        $('#btnCloseBank').addEventListener('click', () => setToast('已切换题库开关（示例）'));
        $('#btnFields').addEventListener('click', () => {
          openModal({
            title: '题库字段（按需求）',
            bodyHtml: `
              <div class="helper">① 类型：选择 / 填空 / 输入答案</div>
              <div class="helper">② 科目：英语 / 数学</div>
              <div class="helper">③ 难度：1~5</div>
              <div class="helper">④ 题目</div>
              <div class="helper">⑤ 选项（选择题）</div>
              <div class="helper">⑥ 输入提示（填空/输入答案题）</div>
              <div class="helper">⑦ 答案</div>
              <div class="helper">⑧ 其他正确答案</div>
              <div class="helper">⑨ 解释</div>
            `,
            okText: '关闭',
            cancelText: '关闭'
          });
        });
      }

      function renderTeacherTaskMgmt(){
        screen.innerHTML = `
          <div class="section">
            <div class="h2">学习任务管理</div>
            <p class="p">创建/管理任务，开关任务，查看学生在学习任务中的学习次数，以及所有学生做错题目的错题统计。</p>
            <div class="divider"></div>

            <div class="card">
              <div class="meta">创建新任务（示例）</div>
              <div class="title">填写参数：名称 / 题库号 / 难度概率 / 题目数量</div>
              <div class="actions"><button class="btn" id="btnCreateTask">创建任务（模拟）</button></div>
            </div>

            <div style="height:8px"></div>
            <div class="list">
              <div class="card">
                <div class="meta">任务：T2 · 数学题库A</div>
                <div class="title">数学·方程练习(中级)</div>
                <div class="actions">
                  <span class="tag good">已开启</span>
                  <span class="tag">学习次数 128</span>
                  <span class="tag bad">错题次数 39</span>
                  <button class="btn secondary" id="btnToggleTask">开关任务</button>
                  <button class="btn" id="btnGoStats">查看错题统计</button>
                </div>
              </div>
            </div>
          </div>
        `;

        $('#btnCreateTask').addEventListener('click', () => {
          openModal({
            title: '创建任务（模拟）',
            bodyHtml: `
              <div class="field"><div class="label">① 名称</div><input class="input" value="数学·方程练习(中级)" /></div>
              <div style="height:8px"></div>
              <div class="field"><div class="label">② 参考题库号</div><input class="input" value="数学题库A" /></div>
              <div style="height:8px"></div>
              <div class="field"><div class="label">③ 难度选择（概率）</div><input class="input" value="{1:10%,2:20%,3:40%,4:20%,5:10%}" /></div>
              <div style="height:8px"></div>
              <div class="field"><div class="label">④ 题目数量</div><input class="input" value="10" /></div>
            `,
            okText: '创建',
            cancelText: '取消',
            onOk: () => setToast('已创建任务（示例）')
          });
        });

        $('#btnToggleTask').addEventListener('click', () => setToast('已切换任务开关（示例）'));
        $('#btnGoStats').addEventListener('click', () => push('t_wrong_stats'));
      }

      function renderTeacherWrongStats(){
        screen.innerHTML = `
          <div class="section">
            <div class="h2">错题统计</div>
            <p class="p">当前原型按“所有学生做错题目的累计统计”展示，可继续查看题目信息、错误学生和对应错误次数。</p>
            <div class="divider"></div>

            <div class="list">
              ${[
                {id:'Q2', stem:'x + 3 = 7，x = ?', students:21, totalWrong:39},
                {id:'Q5', stem:'happy 的同义词', students:17, totalWrong:22},
                {id:'Q4', stem:'哪个是质数？', students:9, totalWrong:11},
              ].map(x => `
                <div class="card">
                  <div class="row wrap" style="justify-content:space-between">
                    <div>
                      <div class="meta">题目ID：${x.id}</div>
                      <div class="title">${x.stem}</div>
                    </div>
                    <div class="row wrap" style="justify-content:flex-end">
                      <span class="tag bad">错误次数 ${x.totalWrong}</span>
                      <span class="tag">错误学生数 ${x.students}</span>
                    </div>
                  </div>
                  <div class="actions">
                    <button class="btn" data-view-q="${x.id}">查看题目信息</button>
                    <button class="btn secondary" data-view-stu="${x.id}">查看错误学生</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        screen.querySelectorAll('[data-view-q]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-view-q');
            openModal({
              title: '题目信息（示例）',
              bodyHtml: `
                <div class="helper">题目ID：<span style="font:var(--text-code)">${id}</span></div>
                <div class="helper">字段：类型/科目/难度/题目/选项/提示/答案/其他答案/解释</div>
              `,
              okText: '关闭',
              cancelText: '关闭'
            });
          });
        });

        screen.querySelectorAll('[data-view-stu]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-view-stu');
            openModal({
              title: '错误学生列表（示例）',
              bodyHtml: `
                <div class="helper">题目：<span style="font:var(--text-code)">${id}</span></div>
                <div class="divider"></div>
                <div class="helper">student_001 · 错误次数 3</div>
                <div class="helper">student_017 · 错误次数 2</div>
                <div class="helper">student_021 · 错误次数 1</div>
              `,
              okText: '关闭',
              cancelText: '关闭'
            });
          });
        });
      }

      function render(routeId){
        setHeader(routeId);
        [...stepsEl.children].forEach(el => el.classList.toggle('active', el.getAttribute('data-route') === routeId));

        switch(routeId){
          case 'entry': renderEntry(); break;
          case 's_join': renderStudentJoin(); break;
          case 's_tasks': renderStudentTasks(); break;
          case 's_task_detail': renderStudentTaskDetail(); break;
          case 's_doing': renderStudentDoing(); break;
          case 's_review': renderStudentReview(); break;
          case 's_wrong': renderStudentWrong(); break;
          case 't_login': renderTeacherLogin(); break;
          case 't_home': renderTeacherHome(); break;
          case 't_class': renderTeacherClass(); break;
          case 't_bank': renderTeacherBank(); break;
          case 't_task_mgmt': renderTeacherTaskMgmt(); break;
          case 't_wrong_stats': renderTeacherWrongStats(); break;
          default: renderEntry();
        }

        screen.querySelectorAll('[data-go="student"]').forEach(btn => {
          btn.addEventListener('click', () => { state.role = 'student'; push('s_join'); });
        });

        screen.querySelectorAll('[data-go="teacher"]').forEach(btn => {
          btn.addEventListener('click', () => { state.role = 'teacher'; push('t_login'); });
        });
      }

      stepsEl.innerHTML = jumpList.map((s, i) => `
        <div class="step" data-route="${s.id}">
          <div class="k">${i + 1}</div>
          <div class="t">
            <div class="name">${s.name}</div>
            <div class="desc">${s.desc}</div>
          </div>
        </div>
      `).join('');

      stepsEl.querySelectorAll('.step').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-route');
          if (state.stack.length === 0) state.stack = ['entry'];
          state.stack.push(id);
          render(id);
        });
      });

      btnBack.addEventListener('click', back);
      btnReset.addEventListener('click', () => {
        state.stack = [];
        state.role = null;
        state.className = null;
        state.classCode = null;
        state.taskId = null;
        state.taskName = null;
        state.quiz.idx = 0;
        state.quiz.answers = {};
        render('entry');
        setToast('已重置');
      });

      state.stack = ['entry'];
      render('entry');
    })();
  </script>
</body>
</html>
