<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel 转 JSON 工具</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 40px 20px;
}
.container { width: 100%; max-width: 1000px; }
.header {
  background: linear-gradient(135deg, #20b86e 0%, #0d8a4c 100%);
  color: #fff;
  padding: 24px 32px;
  border-radius: 12px 12px 0 0;
}
.header h1 { font-size: 22px; font-weight: 600; }
.header p { font-size: 13px; opacity: 0.85; margin-top: 6px; }
.card {
  background: #fff;
  border-radius: 0 0 12px 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  overflow: hidden;
}
.card-body { padding: 24px 32px 32px; }
.section-title {
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin-bottom: 12px;
}

/* 上传区域 */
.upload-zone {
  border: 2px dashed #d9d9d9;
  border-radius: 10px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #fafafa;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: #20b86e;
  background: #f0fdf6;
}
.upload-zone .icon { font-size: 42px; margin-bottom: 12px; }
.upload-zone .text { font-size: 14px; color: #666; }
.upload-zone .hint { font-size: 12px; color: #999; margin-top: 4px; }
.upload-zone input[type="file"] { display: none; }

/* 配置行 */
.config-row {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  padding: 16px;
  background: #fafafa;
  border-radius: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.form-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-group label {
  font-size: 13px;
  font-weight: 500;
  color: #666;
  white-space: nowrap;
}
.form-group select {
  padding: 6px 10px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  font-size: 13px;
  min-width: 80px;
  background: #fff;
}
.form-group select:focus {
  outline: none;
  border-color: #20b86e;
  box-shadow: 0 0 0 2px rgba(32,184,110,0.15);
}

/* 按钮 */
.btn {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary { background: #20b86e; color: #fff; }
.btn-primary:hover { background: #1a9d5c; }
.btn-outline { background: #fff; color: #20b86e; border: 1px solid #20b86e; }
.btn-outline:hover { background: #f0fdf6; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* 表格 */
.table-wrapper {
  max-height: 400px;
  overflow: auto;
  border: 1px solid #e8e8e8;
  border-radius: 8px;
  margin-bottom: 16px;
}
.table-wrapper table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.table-wrapper thead { position: sticky; top: 0; z-index: 2; }
.table-wrapper th {
  background: #f5f5f5;
  padding: 8px 12px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid #e8e8e8;
  white-space: nowrap;
}
.table-wrapper td {
  padding: 6px 12px;
  border-bottom: 1px solid #f0f0f0;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.table-wrapper tr.row-header { background: #e6f7ee; }
.table-wrapper tr.row-data-start { border-top: 2px solid #20b86e; }
.table-wrapper tr:hover { background: #f5f5ff; }
.table-wrapper tr.row-header:hover { background: #d4f0e0; }

.row-num {
  display: inline-block;
  width: 28px;
  height: 20px;
  line-height: 20px;
  text-align: center;
  font-size: 11px;
  border-radius: 3px;
  color: #666;
  background: #f0f0f0;
  margin-right: 4px;
  flex-shrink: 0;
}
.tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
  margin-left: 6px;
}
.tag-header { background: #e6f7ee; color: #20b86e; }
.tag-data { background: #e6f0ff; color: #1677ff; }

/* JSON 预览 */
.json-preview {
  background: #1e1e1e;
  color: #d4d4d4;
  padding: 16px;
  border-radius: 8px;
  font-family: "Consolas", "Courier New", monospace;
  font-size: 13px;
  max-height: 400px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
}

/* 分栏 */
.split-view {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid #f0f0f0;
}
@media (max-width: 768px) {
  .split-view { grid-template-columns: 1fr; }
  .card-body { padding: 16px; }
  .config-row { flex-direction: column; }
}

.empty-state {
  text-align: center;
  padding: 32px 0;
  color: #bbb;
  font-size: 14px;
}

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Excel 转 JSON 工具</h1>
    <p>上传 Excel 文件，选择字段行与数据起始行，一键导出 JSON</p>
  </div>
  <div class="card">
    <div class="card-body">
      <!-- 上传区域 -->
      <div class="upload-zone" id="uploadZone">
        <div class="icon">📄</div>
        <div class="text">点击或拖拽上传 Excel 文件</div>
        <div class="hint">支持 .xlsx / .xls 格式</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls">
      </div>

      <!-- 文件信息 & 配置 -->
      <div id="configArea" style="display:none; margin-top:20px;">
        <div style="margin-bottom:8px; font-size:13px; color:#666;">
          已加载：<strong id="fileName"></strong>（共 <span id="totalRows">0</span> 行，<span id="totalCols">0</span> 列）
        </div>
        <div class="config-row">
          <div class="form-group">
            <label for="headerRow">字段名行：</label>
            <select id="headerRow"></select>
          </div>
          <div class="form-group">
            <label for="dataStartRow">数据起始行：</label>
            <select id="dataStartRow"></select>
          </div>
          <div class="form-group">
            <label for="sheetSelect">工作表：</label>
            <select id="sheetSelect"></select>
          </div>
          <button class="btn btn-primary btn-sm" id="refreshBtn">刷新预览</button>
          <button class="btn btn-sm" id="clearFileBtn" style="background:#fff;color:#ff4d4f;border:1px solid #ff4d4f;">清除文件</button>
        </div>

        <!-- 表格预览 -->
        <div class="section-title">数据预览 <span style="font-weight:400;font-size:12px;color:#999;">（绿色行=字段名，蓝色虚线=数据起始）</span></div>
        <div class="table-wrapper" id="tableWrapper">
          <div class="empty-state">加载中...</div>
        </div>

        <!-- 导出 -->
        <div class="btn-group" style="margin-bottom:20px;">
          <button class="btn btn-primary" id="exportBtn">导出 JSON 文件</button>
          <button class="btn btn-outline" id="copyBtn">复制 JSON</button>
        </div>

        <!-- JSON 预览 -->
        <div class="section-title">JSON 预览</div>
        <div class="json-preview" id="jsonPreview"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 状态 ==========
const state = {
  workbook: null,
  sheetName: "",
  allData: [],        // 当前sheet的全部行数据（二维数组）
  headerRow: 0,       // 字段名所在行（0-based）
  dataStartRow: 1,    // 数据起始行（0-based）
};

// ========== DOM ==========
const uploadZone = document.getElementById("uploadZone");
const fileInput = document.getElementById("fileInput");
const configArea = document.getElementById("configArea");
const headerRowSel = document.getElementById("headerRow");
const dataStartRowSel = document.getElementById("dataStartRow");
const sheetSelect = document.getElementById("sheetSelect");
const refreshBtn = document.getElementById("refreshBtn");
const clearFileBtn = document.getElementById("clearFileBtn");
const tableWrapper = document.getElementById("tableWrapper");
const jsonPreview = document.getElementById("jsonPreview");
const exportBtn = document.getElementById("exportBtn");
const copyBtn = document.getElementById("copyBtn");

// ========== 上传 ==========
uploadZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
});

uploadZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  uploadZone.classList.add("drag-over");
});
uploadZone.addEventListener("dragleave", () => {
  uploadZone.classList.remove("drag-over");
});
uploadZone.addEventListener("drop", (e) => {
  e.preventDefault();
  uploadZone.classList.remove("drag-over");
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      state.workbook = XLSX.read(data, { type: "array" });
      populateSheetSelect();
      loadSheet(state.workbook.SheetNames[0]);
    } catch (err) {
      alert("文件解析失败，请确认是有效的 Excel 文件。\n" + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function clearFile() {
  state.workbook = null;
  state.sheetName = "";
  state.allData = [];
  state.headerRow = 0;
  state.dataStartRow = 1;
  fileInput.value = "";
  configArea.style.display = "none";
  uploadZone.style.display = "";
}

// ========== 工作表切换 ==========
sheetSelect.addEventListener("change", function() {
  loadSheet(this.value);
});

function populateSheetSelect() {
  const names = state.workbook.SheetNames;
  sheetSelect.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
  sheetSelect.value = names[0];
}

function loadSheet(sheetName) {
  state.sheetName = sheetName;
  const ws = state.workbook.Sheets[sheetName];
  // 转为二维数组，保留空行
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", blankrows: true });
  state.allData = aoa;
  state.headerRow = 0;
  state.dataStartRow = Math.min(1, aoa.length - 1);

  document.getElementById("fileName").textContent = sheetName;
  document.getElementById("totalRows").textContent = aoa.length;
  document.getElementById("totalCols").textContent = aoa.length > 0 ? aoa[0].length : 0;
  configArea.style.display = "block";
  uploadZone.style.display = "none";

  populateRowSelects();
  renderAll();
}

function populateRowSelects() {
  const len = state.allData.length;
  let hOpts = "", dOpts = "";
  for (let i = 0; i < len; i++) {
    const label = `第 ${i + 1} 行`;
    hOpts += `<option value="${i}" ${i === state.headerRow ? "selected" : ""}>${label}</option>`;
    dOpts += `<option value="${i}" ${i === state.dataStartRow ? "selected" : ""}>${label}</option>`;
  }
  headerRowSel.innerHTML = hOpts;
  dataStartRowSel.innerHTML = dOpts;
}

headerRowSel.addEventListener("change", function() {
  state.headerRow = parseInt(this.value);
  renderAll();
});
dataStartRowSel.addEventListener("change", function() {
  state.dataStartRow = parseInt(this.value);
  renderAll();
});
refreshBtn.addEventListener("click", () => renderAll());
clearFileBtn.addEventListener("click", clearFile);

// ========== 渲染 ==========
function renderAll() {
  renderTable();
  updateJsonPreview();
}

function renderTable() {
  const data = state.allData;
  if (data.length === 0) {
    tableWrapper.innerHTML = '<div class="empty-state">无数据</div>';
    return;
  }

  const maxCols = Math.max(...data.map(r => r.length), 1);
  const headerIdx = state.headerRow;
  const dataStartIdx = state.dataStartRow;

  let html = '<table><thead><tr><th style="width:60px">行号</th>';
  for (let c = 0; c < maxCols; c++) {
    html += `<th>列 ${colLabel(c)}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (let r = 0; r < data.length; r++) {
    let rowClass = "";
    let tagHtml = "";
    if (r === headerIdx) {
      rowClass = "row-header";
      tagHtml = '<span class="tag tag-header">字段名</span>';
    }
    if (r === dataStartIdx) {
      rowClass += " row-data-start";
      tagHtml += '<span class="tag tag-data">数据开始</span>';
    }

    html += `<tr class="${rowClass}">`;
    html += `<td><span class="row-num">${r + 1}</span>${tagHtml}</td>`;
    for (let c = 0; c < maxCols; c++) {
      const val = data[r] && data[r][c] !== undefined ? String(data[r][c]) : "";
      html += `<td title="${escapeAttr(val)}">${escapeHtml(val)}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  tableWrapper.innerHTML = html;
}

function colLabel(n) {
  let s = "";
  while (n >= 0) {
    s = String.fromCharCode(65 + (n % 26)) + s;
    n = Math.floor(n / 26) - 1;
  }
  return s;
}

function buildJson() {
  const data = state.allData;
  const headerIdx = state.headerRow;
  const dataStartIdx = state.dataStartRow;

  // 获取字段名
  const headerRow = data[headerIdx] || [];
  const fields = headerRow.map((v, i) => {
    const name = String(v || "").trim();
    return name || `field_${i + 1}`;
  });

  // 构建JSON数组（从dataStartIdx开始）
  const result = [];
  for (let r = dataStartIdx; r < data.length; r++) {
    const row = data[r];
    if (!row || row.every(cell => cell === "" || cell === undefined || cell === null)) continue;
    const obj = {};
    for (let c = 0; c < fields.length; c++) {
      obj[fields[c]] = row[c] !== undefined ? row[c] : "";
    }
    result.push(obj);
  }
  return result;
}

function updateJsonPreview() {
  const json = buildJson();
  const str = JSON.stringify(json, null, 2);
  jsonPreview.textContent = str || "[]";
}

// ========== 导出 ==========
exportBtn.addEventListener("click", function() {
  const json = buildJson();
  const blob = new Blob([JSON.stringify(json, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (state.sheetName || "export") + ".json";
  a.click();
  URL.revokeObjectURL(url);
});

copyBtn.addEventListener("click", function() {
  const json = buildJson();
  const str = JSON.stringify(json, null, 2);
  navigator.clipboard.writeText(str).then(() => {
    const orig = copyBtn.textContent;
    copyBtn.textContent = "已复制!";
    setTimeout(() => { copyBtn.textContent = orig; }, 1500);
  }).catch(() => {
    alert("复制失败，请手动复制");
  });
});

// ========== 工具函数 ==========
function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(str) {
  return str.replace(/"/g, "&quot;").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
</body>
</html>
