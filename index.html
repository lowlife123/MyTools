<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card {
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">
                🚀 我的工作台
            </h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Section: 本地工具 -->
        <div class="mb-10">
            <h2 class="text-xl font-semibold text-gray-800 mb-4 border-l-4 border-blue-500 pl-3">本地工具</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- Card: Car Calculator -->
                <a href="car_calculator.html" class="card block bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:border-blue-300 group">
                    <div class="flex items-center space-x-4">
                        <div class="p-3 bg-blue-50 rounded-lg text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 group-hover:text-blue-600">购车成本计算器</h3>
                            <p class="text-sm text-gray-500 mt-1">全方位计算油车/电车购车及后续养车成本</p>
                        </div>
                    </div>
                </a>

                <!-- Card: Time Calculator -->
                <a href="time_calculator.html" class="card block bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:border-blue-300 group">
                    <div class="flex items-center space-x-4">
                        <div class="p-3 bg-indigo-50 rounded-lg text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 group-hover:text-indigo-600">时间间隔计算器</h3>
                            <p class="text-sm text-gray-500 mt-1">计算两个时间点之间的天数、小时和秒数</p>
                        </div>
                    </div>
                </a>

                <!-- Card: General Calculator -->
                <a href="calculator.html" class="card block bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:border-blue-300 group">
                    <div class="flex items-center space-x-4">
                        <div class="p-3 bg-purple-50 rounded-lg text-purple-600 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 group-hover:text-purple-600">在线计算器</h3>
                            <p class="text-sm text-gray-500 mt-1">支持简单计算与科学计算模式</p>
                        </div>
                    </div>
                </a>

                <!-- Card: Probability Tool -->
                <a href="probability-tool.html" class="card block bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:border-blue-300 group">
                    <div class="flex items-center space-x-4">
                        <div class="p-3 bg-green-50 rounded-lg text-green-600 group-hover:bg-green-600 group-hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 group-hover:text-green-600">概率分配计算器</h3>
                            <p class="text-sm text-gray-500 mt-1">配置参数名称与概率值，实时饼图预览</p>
                        </div>
                    </div>
                </a>

            </div>
        </div>

        <!-- Section: 常用网站 (Example) -->
        <div>
            <h2 class="text-xl font-semibold text-gray-800 mb-4 border-l-4 border-purple-500 pl-3">常用网站</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                
                <!-- Example Link 1 -->
                <a href="https://www.google.com" target="_blank" class="card bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:border-purple-300 flex items-center space-x-3">
                    <img src="https://www.google.com/favicon.ico" alt="Google" class="w-5 h-5">
                    <span class="font-medium text-gray-700">Google</span>
                </a>

                <!-- Example Link 2 -->
                <a href="https://github.com" target="_blank" class="card bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:border-purple-300 flex items-center space-x-3">
                    <img src="https://github.com/favicon.ico" alt="GitHub" class="w-5 h-5">
                    <span class="font-medium text-gray-700">GitHub</span>
                </a>

                <!-- Baidu -->
                <a href="https://www.baidu.com" target="_blank" class="card bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:border-purple-300 flex items-center space-x-3">
                    <img src="https://www.baidu.com/favicon.ico" alt="Baidu" class="w-5 h-5">
                    <span class="font-medium text-gray-700">百度</span>
                </a>

                <!-- Bing -->
                <a href="https://www.bing.com" target="_blank" class="card bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:border-purple-300 flex items-center space-x-3">
                    <img src="https://www.bing.com/favicon.ico" alt="Bing" class="w-5 h-5">
                    <span class="font-medium text-gray-700">必应</span>
                </a>

                <!-- Add more links here -->
                 
                 <!-- <a href="#" class="card bg-gray-50 p-4 rounded-lg border border-dashed border-gray-300 flex justify-center items-center text-gray-400 text-sm hover:bg-gray-100">
                    + 添加链接
                </a> -->

            </div>
        </div>

    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-gray-500 text-sm">
            &copy; Lowlife123
        </div>
    </footer>

</body>
</html>
