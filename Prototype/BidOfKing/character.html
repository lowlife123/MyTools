<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色 - BidOfKing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-frame {
            width: 540px;
            height: 960px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.95) 0%, rgba(26, 26, 46, 0.8) 100%);
            z-index: 100;
            padding-top: 20px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .back-btn span {
            font-size: 26px;
            color: white;
        }

        .page-title {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .content-area {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            padding: 20px;
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 20px;
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            border-radius: 3px;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .character-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .character-card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }

        .character-card.locked {
            opacity: 0.4;
            filter: grayscale(0.5);
        }

        .character-card.locked:hover {
            transform: none;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .character-avatar {
            font-size: 45px;
            margin-bottom: 8px;
            position: relative;
        }

        .character-card.owned .character-avatar::after {
            content: '✓';
            position: absolute;
            bottom: -2px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            border: 2px solid rgba(30, 30, 50, 0.8);
        }

        .character-name {
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        .character-card.locked .character-name {
            color: rgba(255, 255, 255, 0.5);
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.3) 50%, transparent 100%);
            margin: 25px 0;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <div class="back-btn" onclick="location.href='home.html'">
                <span>←</span>
            </div>
            <div class="page-title">角色</div>
        </div>

        <div class="content-area">
            <div class="section-title">已拥有</div>
            <div class="character-grid" id="ownedGrid">
            </div>

            <div class="divider"></div>

            <div class="section-title">未拥有</div>
            <div class="character-grid" id="unownedGrid">
            </div>
        </div>
    </div>

    <script>
        const characters = [
            { id: 1, name: '珠宝商人', avatar: '💎', owned: true },
            { id: 2, name: '废品收集者', avatar: '♻️', owned: true },
            { id: 3, name: '考古专家', avatar: '🏺', owned: true },
            { id: 4, name: '收藏家', avatar: '🎨', owned: true },
            { id: 5, name: '军事爱好者', avatar: '🎖️', owned: true },
            { id: 6, name: '财富大亨', avatar: '💰', owned: false },
            { id: 7, name: '粗鲁竞拍手', avatar: '🔨', owned: false },
            { id: 8, name: '医生', avatar: '⚕️', owned: false },
            { id: 9, name: '私家侦探', avatar: '🔍', owned: false },
            { id: 10, name: '法国赌神', avatar: '🃏', owned: false }
        ];

        function renderCharacters() {
            const ownedGrid = document.getElementById('ownedGrid');
            const unownedGrid = document.getElementById('unownedGrid');
            
            const owned = characters.filter(c => c.owned);
            const unowned = characters.filter(c => !c.owned);
            
            let ownedHtml = '';
            owned.forEach(char => {
                ownedHtml += `
                    <div class="character-card owned" onclick="goToDetail(${char.id})">
                        <div class="character-avatar">${char.avatar}</div>
                        <div class="character-name">${char.name}</div>
                    </div>
                `;
            });
            
            let unownedHtml = '';
            unowned.forEach(char => {
                unownedHtml += `
                    <div class="character-card locked" onclick="goToDetail(${char.id})">
                        <div class="character-avatar">${char.avatar}</div>
                        <div class="character-name">${char.name}</div>
                    </div>
                `;
            });
            
            ownedGrid.innerHTML = ownedHtml;
            unownedGrid.innerHTML = unownedHtml;
        }

        renderCharacters();

        function goToDetail(charId) {
            location.href = 'character-detail.html?id=' + charId;
        }
    </script>
</body>
</html>
