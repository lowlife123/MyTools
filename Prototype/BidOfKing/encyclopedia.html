<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图鉴 - BidOfKing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-frame {
            width: 540px;
            height: 960px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 140px;
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.95) 0%, rgba(26, 26, 46, 0.8) 100%);
            z-index: 100;
            padding-top: 20px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .back-btn span {
            font-size: 30px;
            color: white;
        }

        .page-title {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .category-tabs {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            padding: 0 10px;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            flex-shrink: 0;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .category-tab.active {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #4a2c00;
            font-weight: bold;
            border: none;
        }

        .category-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.2);
        }

        .content-area {
            position: absolute;
            top: 140px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            padding: 20px;
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 22px;
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            border-radius: 3px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .item-name {
            font-size: 14px;
            color: white;
            text-align: center;
            line-height: 1.2;
        }

        .item-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #4a2c00;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 24px;
            text-align: center;
        }

        .item-price {
            position: absolute;
            bottom: 8px;
            left: 8px;
            color: #ffd700;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .item-card {
            aspect-ratio: 1;
            background: rgba(255, 0, 0, 0.15);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 2px solid #ef4444;
            transition: all 0.3s ease;
            position: relative;
        }

        .item-card:hover {
            transform: scale(1.05);
            background: rgba(255, 0, 0, 0.25);
        }

        .item-card.locked {
            opacity: 0.4;
            filter: grayscale(0.8);
        }

        .item-card.locked:hover {
            transform: none;
        }

        .item-icon {
            font-size: 45px;
            margin-bottom: 8px;
        }

        .item-name {
            font-size: 14px;
            color: white;
            text-align: center;
            line-height: 1.2;
        }

        .item-card.locked .item-name {
            color: rgba(255, 255, 255, 0.5);
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.3) 50%, transparent 100%);
            margin: 30px 0;
        }

        .empty-section {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <div class="back-btn" onclick="location.href='home.html'">
                <span>←</span>
            </div>
            <div class="page-title">图鉴</div>
            <div class="category-tabs">
                <div class="category-tab active" data-category="all">全部</div>
                <div class="category-tab" data-category="electronic">电子物品</div>
                <div class="category-tab" data-category="material">工具材料</div>
                <div class="category-tab" data-category="medical">医疗物品</div>
                <div class="category-tab" data-category="jewelry">珠宝首饰</div>
            </div>
        </div>

        <div class="content-area" id="content">
        </div>
    </div>

    <script>
        const itemData = {
            electronic: {
                name: '电子物品',
                obtained: [
                    { id: 1, name: '智能手机', icon: '📱', count: 3, price: 5000 },
                    { id: 2, name: '笔记本电脑', icon: '💻', count: 1, price: 8000 },
                    { id: 3, name: '智能手表', icon: '⌚', count: 5, price: 2000 },
                    { id: 4, name: '无线耳机', icon: '🎧', count: 2, price: 1500 },
                    { id: 5, name: '平板电脑', icon: '📲', count: 1, price: 4500 },
                    { id: 6, name: '游戏主机', icon: '🎮', count: 1, price: 3500 }
                ],
                locked: [
                    { id: 7, name: '智能眼镜', icon: '👓', price: 3000 },
                    { id: 8, name: 'VR设备', icon: '🥽', price: 6000 },
                    { id: 9, name: '无人机', icon: '🚁', price: 4000 }
                ]
            },
            material: {
                name: '工具材料',
                obtained: [
                    { id: 10, name: '金砖', icon: '🧱', count: 10, price: 10000 },
                    { id: 11, name: '钻石', icon: '💎', count: 3, price: 15000 },
                    { id: 12, name: '翡翠', icon: '🟢', count: 2, price: 8000 }
                ],
                locked: [
                    { id: 13, name: '红宝石', icon: '🔴', price: 12000 },
                    { id: 14, name: '蓝宝石', icon: '🔵', price: 10000 },
                    { id: 15, name: '祖母绿', icon: '💚', price: 9000 },
                    { id: 16, name: '铂金', icon: '⚪', price: 7000 },
                    { id: 17, name: '钛合金', icon: '🔩', price: 5000 }
                ]
            },
            medical: {
                name: '医疗物品',
                obtained: [
                    { id: 20, name: '医疗箱', icon: '🩹', count: 4, price: 1000 },
                    { id: 21, name: '血压计', icon: '❤️', count: 1, price: 800 }
                ],
                locked: [
                    { id: 22, name: '心电图机', icon: '💟', price: 5000 },
                    { id: 23, name: 'X光机', icon: '☢️', price: 8000 },
                    { id: 24, name: '手术器械', icon: '🔬', price: 6000 }
                ]
            },
            jewelry: {
                name: '珠宝首饰',
                obtained: [
                    { id: 30, name: '金项链', icon: '📿', count: 2, price: 6000 },
                    { id: 31, name: '钻戒', icon: '💍', count: 1, price: 10000 },
                    { id: 32, name: '珍珠耳环', icon: '✨', count: 3, price: 4500 }
                ],
                locked: [
                    { id: 33, name: '王冠', icon: '👑', price: 20000 },
                    { id: 34, name: '手镯', icon: '⭕', price: 5500 }
                ]
            }
        };

        function getAllItems() {
            const allObtained = [];
            const allLocked = [];
            
            for (const key in itemData) {
                allObtained.push(...itemData[key].obtained);
                allLocked.push(...itemData[key].locked);
            }
            
            return { obtained: allObtained, locked: allLocked };
        }

        function renderItems(category) {
            const content = document.getElementById('content');
            let data;
            
            if (category === 'all') {
                data = getAllItems();
            } else {
                data = itemData[category] || { obtained: [], locked: [] };
            }
            
            data.obtained.sort((a, b) => (b.price || 0) - (a.price || 0));
            data.locked.sort((a, b) => (b.price || 0) - (a.price || 0));
            
            let html = '';
            
            if (data.obtained.length > 0) {
                html += `<div class="section-title">已获得过的物品</div>`;
                html += `<div class="items-grid">`;
                data.obtained.forEach(item => {
                    const count = item.count || 1;
                    const price = item.price || 0;
                    html += `
                        <div class="item-card">
                            <span class="item-icon">${item.icon}</span>
                            <span class="item-name">${item.name}</span>
                            <span class="item-price">💰${price.toLocaleString()}</span>
                            <span class="item-count">x${count}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            if (data.locked.length > 0) {
                if (data.obtained.length > 0) {
                    html += `<div class="divider"></div>`;
                }
                html += `<div class="section-title">未获得过的物品</div>`;
                html += `<div class="items-grid">`;
                data.locked.forEach(item => {
                    const price = item.price || 0;
                    html += `
                        <div class="item-card locked">
                            <span class="item-icon">${item.icon}</span>
                            <span class="item-name">${item.name}</span>
                            <span class="item-price">💰${price.toLocaleString()}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            if (data.obtained.length === 0 && data.locked.length === 0) {
                html += `<div class="empty-section">暂无物品</div>`;
            }
            
            content.innerHTML = html;
        }

        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderItems(this.dataset.category);
            });
        });

        renderItems('all');
    </script>
</body>
</html>
