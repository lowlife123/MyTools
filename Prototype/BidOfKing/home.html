<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidOfKing - 游戏主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-frame {
            width: 540px;
            height: 960px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .top-left-info {
            position: absolute;
            top: 60px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }

        .level-badge {
            margin-top: 8px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 4px 17px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(245, 87, 108, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-badge:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.6);
        }

        .coins-display {
            position: absolute;
            top: 80px;
            left: 120px;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 3px 8px rgba(255, 215, 0, 0.3);
        }

        .coin-icon {
            font-size: 23px;
            margin-right: 5px;
        }

        .coin-amount {
            font-size: 18px;
            font-weight: bold;
            color: #4a2c00;
        }

        .top-right-buttons {
            position: absolute;
            top: 60px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .settings-icon {
            font-size: 25px;
            color: white;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px;
        }

        .menu-line {
            width: 23px;
            height: 3px;
            background: white;
            border-radius: 2px;
        }

        .gallery-btn {
            position: absolute;
            bottom: 260px;
            left: 20px;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #06b6d4 0%, #0ea5e9 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 16px rgba(6, 182, 212, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 50;
        }

        .gallery-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 21px rgba(6, 182, 212, 0.6);
        }

        .gallery-icon {
            font-size: 35px;
        }

        .gallery-text {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-top: 3px;
        }

        .role-btn {
            position: absolute;
            bottom: 160px;
            left: 20px;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 16px rgba(168, 85, 247, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 50;
        }

        .role-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 21px rgba(168, 85, 247, 0.6);
        }

        .role-icon {
            font-size: 35px;
        }

        .role-text {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-top: 3px;
        }

        .rank-btn {
            position: absolute;
            bottom: 160px;
            right: 20px;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 16px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 50;
        }

        .rank-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 21px rgba(239, 68, 68, 0.6);
        }

        .rank-icon {
            font-size: 35px;
        }

        .rank-text {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-top: 3px;
        }

        .bottom-nav {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
        }

        .side-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .side-btn .icon {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .side-btn .text {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .start-btn {
            width: 180px;
            height: 90px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border-radius: 25px;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 21px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 26px rgba(255, 215, 0, 0.6);
        }

        .start-btn .icon {
            font-size: 30px;
        }

        .start-btn .text {
            color: #4a2c00;
            font-size: 18px;
            font-weight: bold;
            margin-top: 3px;
        }

        .game-title {
            position: absolute;
            top: 225px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .game-title h1 {
            font-size: 45px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 16px rgba(255, 215, 0, 0.5);
        }

        .game-title p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: #ffd700;
            top: -100px;
            right: -100px;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            background: #a855f7;
            bottom: 200px;
            left: -75px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="decorative-circle circle-1"></div>
        <div class="decorative-circle circle-2"></div>

        <div class="top-left-info">
            <div class="avatar">👤</div>
            <div class="level-badge" onclick="location.href='level-rewards.html'">Lv.25</div>
        </div>

        <div class="coins-display">
            <span class="coin-icon">💰</span>
            <span class="coin-amount">1,280,500</span>
        </div>

        <div class="top-right-buttons">
            <div class="icon-btn">
                <span class="settings-icon">⚙️</span>
            </div>
            <div class="icon-btn">
                <div class="menu-icon">
                    <div class="menu-line"></div>
                    <div class="menu-line"></div>
                    <div class="menu-line"></div>
                </div>
            </div>
        </div>

        <div class="game-title">
            <h1>BID OF KING</h1>
            <p>竞价之王</p>
        </div>

        <div class="gallery-btn" onclick="location.href='gallery.html'">
            <span class="gallery-icon">🏛️</span>
            <span class="gallery-text">展览馆</span>
        </div>

        <div class="role-btn" onclick="location.href='character.html'">
            <span class="role-icon">🎭</span>
            <span class="role-text">角色</span>
        </div>

        <div class="rank-btn" onclick="location.href='ranking.html'">
            <span class="rank-icon">🏆</span>
            <span class="rank-text">排行榜</span>
        </div>

        <div class="bottom-nav">
            <div class="nav-btn side-btn" onclick="location.href='encyclopedia.html'">
                <span class="icon">📖</span>
                <span class="text">图鉴</span>
            </div>

            <div class="nav-btn start-btn" onclick="location.href='select-level.html'">
                <span class="icon">🎯</span>
                <span class="text">开始竞拍</span>
            </div>

            <div class="nav-btn side-btn" onclick="location.href='warehouse.html'">
                <span class="icon">📦</span>
                <span class="text">仓库</span>
            </div>
        </div>
    </div>
</body>
</html>
